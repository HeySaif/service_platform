publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  # Enable when you connect the real backend (see MockDataService):
  # supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
